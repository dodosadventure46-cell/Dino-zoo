name: Build APK Dino Zoo

# Cara pakai:
# 1. Unggah DinoZoo.zip (TANPA diekstrak) ke root repo GitHub kamu.
# 2. Simpan file ini di .github/workflows/build-apk.yml
# 3. Buka tab Actions -> "Build APK Dino Zoo" -> Run workflow (atau otomatis tiap push).
# 4. Setelah hijau, buka run-nya, unduh APK di bagian "Artifacts" (DinoZoo-APK).
# Workflow ini mengekstrak zip sendiri. Kalau project.godot sudah ada di root repo, zip diabaikan.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    env:
      GODOT_VERSION: "4.3"
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan proyek (ekstrak zip bila perlu)
        shell: bash
        run: |
          if [ -f project.godot ]; then
            PROJ="."
          else
            ZIP=$(ls *.zip 2>/dev/null | head -n 1)
            if [ -z "$ZIP" ]; then
              echo "Tidak ada project.godot maupun file .zip di root repo"
              exit 1
            fi
            echo "Mengekstrak $ZIP"
            mkdir -p _proj
            unzip -q -o "$ZIP" -d _proj
            PROJ=$(dirname "$(find _proj -name project.godot | head -n 1)")
          fi
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          echo "Proyek ada di: $PROJ"

      - name: Siapkan Godot (template ekspor, setelan Android, keystore debug)
        shell: bash
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          if [ "$HOME" != "/root" ]; then
            mkdir -v -p ~/.config/
            if [ -d /root/.config/godot ]; then cp -r /root/.config/godot ~/.config/; fi
            mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          fi
          SETTINGS=$(ls ~/.config/godot/editor_settings-4*.tres 2>/dev/null | head -n 1)
          if [ -z "$SETTINGS" ]; then
            mkdir -p ~/.config/godot
            SETTINGS=~/.config/godot/editor_settings-4.tres
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' > "$SETTINGS"
          fi
          ANDROID_SDK="${ANDROID_HOME:-/usr/lib/android-sdk}"
          JAVA_DIR=$(dirname "$(dirname "$(readlink -f "$(which javac)")")")
          grep -q "android_sdk_path" "$SETTINGS" || echo "export/android/android_sdk_path = \"$ANDROID_SDK\"" >> "$SETTINGS"
          grep -q "java_sdk_path" "$SETTINGS" || echo "export/android/java_sdk_path = \"$JAVA_DIR\"" >> "$SETTINGS"
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$GITHUB_WORKSPACE/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Import aset lalu ekspor APK
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          cd "$PROJ"
          timeout 300 godot --headless --editor --quit || true
          godot --headless --verbose --export-debug "Android" "$GITHUB_WORKSPACE/out/DinoZoo.apk"
          ls -la "$GITHUB_WORKSPACE/out"

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: DinoZoo-APK
          path: out/DinoZoo.apk
